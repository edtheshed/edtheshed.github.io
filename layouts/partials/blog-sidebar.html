<aside class="blog-sidebar">
    <div class="sidebar-section">
        <h4>Archive</h4>
        <ul class="archive-list">
            {{ range (where .Site.RegularPages "Section" "posts").GroupByDate "Jan 2006" }}
            <li>
                <a href="#" class="archive-filter" data-month="{{ .Key }}">{{ .Key }}</a>
                <span class="count">({{ len .Pages }})</span>
            </li>
            {{ end }}
            <li>
                <a href="#" class="archive-filter" data-month="all">Show All</a>
            </li>
        </ul>
    </div>

    <div class="sidebar-section">
        <h4>Tags</h4>
        <div class="tag-cloud">
            {{ range .Site.Taxonomies.tags }}
            <a href="#" class="tag tag-filter" data-tag="{{ .Page.Title | urlize }}">
                {{ .Page.Title }} ({{ .Count }})
            </a>
            {{ end }}
            <a href="#" class="tag tag-filter" data-tag="all">All</a>
        </div>
    </div>
</aside>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const posts = document.querySelectorAll('.posts-group');
    const postItems = document.querySelectorAll('.post-item');

    // Archive filtering by month
    document.querySelectorAll('.archive-filter').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const month = this.dataset.month;

            document.querySelectorAll('.archive-filter').forEach(l => l.classList.remove('active'));
            this.classList.add('active');

            if (month === 'all') {
                posts.forEach(p => p.style.display = '');
                postItems.forEach(p => p.style.display = '');
            } else {
                posts.forEach(function(group) {
                    const yearHeader = group.querySelector('.post-year');
                    const items = group.querySelectorAll('.post-item');
                    let hasVisible = false;

                    items.forEach(function(item) {
                        const dateText = item.querySelector('.post-day').textContent.trim();
                        const monthAbbr = dateText.split(' ')[0]; // Get just "Jan" from "Jan 12"
                        const postMonth = monthAbbr + ' ' + yearHeader.textContent.trim();
                        if (postMonth === month) {
                            item.style.display = '';
                            hasVisible = true;
                        } else {
                            item.style.display = 'none';
                        }
                    });

                    group.style.display = hasVisible ? '' : 'none';
                });
            }
        });
    });

    // Tag filtering
    document.querySelectorAll('.tag-filter').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const tag = this.dataset.tag;

            document.querySelectorAll('.tag-filter').forEach(l => l.classList.remove('active'));
            this.classList.add('active');

            if (tag === 'all') {
                window.location.href = '{{ $.Site.BaseURL }}posts/';
            } else {
                window.location.href = '{{ $.Site.BaseURL }}tags/' + tag + '/';
            }
        });
    });
});
</script>
